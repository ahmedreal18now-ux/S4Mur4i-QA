
name: Build S4Mur4i QA APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate and extract project ZIP
        run: |
          ZIP=$(find . -type f -iname 'S4Mur4i_QA_Starter.zip' -print -quit)
          if [ -z "$ZIP" ]; then
            echo "Project ZIP not found"
            find . -maxdepth 4 -type f
            exit 1
          fi
          mkdir source
          unzip -q "$ZIP" -d source

      - name: Locate project
        run: |
          PROJECT=$(find source -name settings.gradle.kts -printf '%h\n' -quit)
          if [ -z "$PROJECT" ]; then
            echo "Gradle project not found"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: "15859902"
          accept-android-sdk-licenses: true
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        run: |
          gradle -p "$PROJECT_DIR" :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: S4Mur4i-QA-debug-apk
          path: source/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
